<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui,sans-serif;color:var(--text,#30383a)}
p{margin:0 0 10px;opacity:.7;line-height:1.6}canvas{display:block;width:auto;max-width:100%;height:auto;max-height:360px;margin-inline:auto;border-radius:8px;touch-action:none;cursor:crosshair;background:#8882}
.actions{display:flex;gap:8px;align-items:center;padding-top:10px}button{padding:7px 12px;border-radius:7px;border:1px solid #8886;cursor:pointer;background:transparent;color:inherit;font:inherit}
button.primary{background:#16836c;color:white;border-color:#16836c}button:disabled{opacity:.4;cursor:default}#status{font-size:11px;opacity:.65}
</style></head><body>
<p>在图片上拖动框选，点击“应用裁剪”。可重新拖动选择；默认保留整张图片。</p>
<canvas id="crop" aria-label="拖动框选裁剪区域"></canvas>
<div class="actions"><button id="apply" class="primary" disabled>应用裁剪</button><button id="whole">使用完整图片</button><span id="status" aria-live="polite"></span></div>
<script>
const canvas=document.getElementById('crop'),ctx=canvas.getContext('2d'),apply=document.getElementById('apply'),status=document.getElementById('status');
const image=new Image();let imageId=null,resetToken=null,box=null,start=null,serial=0;
function send(type,data){window.parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function height(){requestAnimationFrame(()=>send('streamlit:setFrameHeight',{height:document.body.scrollHeight+3}))}
function draw(){
 if(!image.complete||!image.naturalWidth)return;
 canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;ctx.drawImage(image,0,0);
 if(box){const[x0,y0,x1,y1]=box.map((v,i)=>v*(i%2?canvas.height:canvas.width));
 ctx.fillStyle='#0007';ctx.fillRect(0,0,canvas.width,y0);ctx.fillRect(0,y1,canvas.width,canvas.height-y1);ctx.fillRect(0,y0,x0,y1-y0);ctx.fillRect(x1,y0,canvas.width-x1,y1-y0);
 ctx.strokeStyle='#31d5ac';ctx.lineWidth=2;ctx.strokeRect(x0,y0,x1-x0,y1-y0);}
 height();
}
function point(event){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(event.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(event.clientY-r.top)/r.height))]}
canvas.addEventListener('pointerdown',e=>{if(!image.complete)return;start=point(e);box=[...start,...start];canvas.setPointerCapture(e.pointerId);apply.disabled=true;status.textContent='';draw()});
canvas.addEventListener('pointermove',e=>{if(!start)return;const p=point(e);box=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])];draw()});
canvas.addEventListener('pointerup',e=>{if(!start)return;start=null;apply.disabled=!box||(box[2]-box[0])*canvas.width<2||(box[3]-box[1])*canvas.height<2;draw()});
canvas.addEventListener('pointercancel',()=>{start=null;box=null;apply.disabled=true;draw()});
function commit(selected){send('streamlit:setComponentValue',{dataType:'json',value:{image_id:imageId,box:selected,event_id:Date.now()+'-'+(++serial)}})}
apply.addEventListener('click',()=>{if(!apply.disabled){status.textContent='已应用';commit(box)}});
document.getElementById('whole').addEventListener('click',()=>{box=null;apply.disabled=true;status.textContent='已恢复完整图片';draw();commit(null)});
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data.type!=='streamlit:render')return;
 const a=event.data.args,changed=imageId!==a.image_id,reset=resetToken!==a.reset_token;
 if(event.data.theme)document.body.style.setProperty('--text',event.data.theme.textColor);
 if(changed||reset){box=a.applied_box||null;start=null;apply.disabled=true;status.textContent='';}
 imageId=a.image_id;resetToken=a.reset_token;
 if(image.src!==a.image){image.onload=draw;image.src=a.image;}else draw();
});
new ResizeObserver(height).observe(document.body);
send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
